services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    image: 194872824128.dkr.ecr.ap-south-1.amazonaws.com/chat-backend:latest
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/my_database
    depends_on:
      - mongodb

  frontend:
    image: 194872824128.dkr.ecr.ap-south-1.amazonaws.com/chat-frontend:latest
    ports:
      - "80:5173"
    command: npm run dev -- --host
    depends_on:
      - backend

volumes:
  mongo_data: