services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./server # Updated to match your Node.js folder
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/my_database
    depends_on:
      - mongodb

  frontend:
    build: ./client # Updated to match your React folder
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data: